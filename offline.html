<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <title>THE CARD MAP — Offline</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
    main{width:min(520px,100%);padding:28px;border:1px solid #393941;border-radius:24px;background:#17171c;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}
    .pin{font-size:56px}
    h1{margin:8px 0 4px;font-size:2rem}
    p{color:#c7c7cf;line-height:1.5}
    button{margin-top:12px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:#e11420;color:#fff;font-size:1rem}
    small{display:block;margin-top:20px;color:#85858f}
  </style>
</head>
<body>
  <main>
    <div class="pin">📍</div>
    <h1>THE CARD MAP</h1>
    <p>Your CardShow Scout can’t reach the road right now. Reconnect to the internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <small>Built by a collector, for collectors.</small>
  </main>
</body>
</html>
